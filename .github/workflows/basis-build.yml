# SPDX-License-Identifier: MIT
#
# Basis fork build: produce a pinned tla2tools.jar and publish it as a
# per-commit GitHub release with a sha256 checksum. Mirrors the
# BasisResearch/cvc5 and BasisResearch/z3 basis-build workflows, so
# verus-tools-mcp can download the jar unauthenticated and verify it against
# a hardcoded hash. The jar is platform independent, so there is one asset,
# not a macOS/Linux pair; the consumer supplies a Java 11+ runtime.
#
# Upstream's pr.yml still runs the TLC unit tests on pull requests; this
# workflow only builds and publishes.

name: basis-build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# PR runs group by ref, so a new push cancels the superseded build. Master
# runs group by commit: GitHub keeps only one pending run per group and
# cancels the rest, so a per-ref group would still skip the release of a
# commit whose run was queued behind a long build.
concurrency:
  group: basis-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # customBuild.xml's git-revision target reads the repository with
          # JGit 2.3; it needs a full, non-partial clone.
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: install ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: build tla2tools.jar
        run: |
          ant -f tlatools/org.lamport.tlatools/customBuild.xml info compile compile-test dist

      - name: package
        shell: bash
        run: |
          cp tlatools/org.lamport.tlatools/dist/tla2tools.jar tla2tools.jar
          # Smoke test: a jar that cannot model-check Bakery fails the build
          # before anything is published.
          java -cp tla2tools.jar tlc2.TLC -tool -workers 1 \
            -metadir "$RUNNER_TEMP/tlc-states" \
            tlatools/org.lamport.tlatools/test-model/pcal/Bakery.tla
          shasum -a 256 tla2tools.jar > tla2tools.jar.sha256
          cat tla2tools.jar.sha256

      - name: upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tla2tools
          path: |
            tla2tools.jar
            tla2tools.jar.sha256
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download the build artifact
        uses: actions/download-artifact@v8
        with:
          # Name the artifact and its directory: downloading everything
          # unnamed lands the files in the workspace root, not in a
          # per-artifact directory.
          name: tla2tools
          path: dist

      - name: publish per-commit release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="basis-${GITHUB_SHA:0:10}"
          assets=(
            dist/tla2tools.jar
            dist/tla2tools.jar.sha256
            SHA256SUMS
          )
          # The jar is not byte-reproducible (the manifest carries the build
          # date), so a re-run must not replace a published release whose hash
          # verus-tools-mcp may already pin; an intentional replacement needs a
          # manual `gh release delete`. A draft is what an interrupted
          # `gh release create` leaves behind (it uploads to a draft, then
          # publishes); it was never public, so it is replaced.
          if release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$release")" = true ]; then
              echo "release $tag is a leftover draft; replacing it"
              gh release delete -y "$tag" --repo "$GITHUB_REPOSITORY"
            else
              missing=0
              for a in "${assets[@]}"; do
                if ! jq -e --arg n "${a##*/}" \
                    'any(.assets[]; .name == $n and .state == "uploaded")' \
                    <<<"$release" >/dev/null; then
                  echo "::error::release $tag is published but lacks ${a##*/}"
                  missing=1
                fi
              done
              if [ "$missing" = 1 ]; then
                echo "::error::delete it by hand (gh release delete -y $tag --cleanup-tag) and re-run"
                exit 1
              fi
              echo "release $tag already exists and is complete; keeping it"
              exit 0
            fi
          fi
          (cd dist && shasum -a 256 -c tla2tools.jar.sha256)
          cp dist/tla2tools.jar.sha256 SHA256SUMS
          {
            printf 'Pinned Basis build of tla2tools.jar at %s.\n\n' "$GITHUB_SHA"
            printf '%s\n' '```'
            cat SHA256SUMS
            printf '%s\n' '```'
          } > RELEASE_NOTES.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Basis TLC build $tag" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"
